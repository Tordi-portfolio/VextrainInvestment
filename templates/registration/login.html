{% extends "base.html" %}
{% block title %}Log in · VextrainInvestment{% endblock %}
{% block content %}
<h1>Log in</h1>
<div class="panel">
<form method="post">{% csrf_token %}
  {{ form.non_field_errors }}
  <label for="{{ form.username.id_for_label }}">Username</label>{{ form.username }}
  <label for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}
  <input type="hidden" name="next" value="{{ next }}">
  <p><button class="btn" type="submit">Log in</button></p>
</form>
</div>
<p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
{% endblock %}
